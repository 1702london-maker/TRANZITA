<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tranzita Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(120deg, #fff0e4 0%, #fff9f2 52%, #f1f6ea 100%);
        color: #183024;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(560px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #dde9d2;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(24, 48, 36, 0.08);
      }
      img {
        width: 180px;
        max-width: 70%;
        height: auto;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: clamp(28px, 8vw, 44px);
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: #65785f;
        font-size: 16px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-transparent.png" alt="Tranzita" />
      <h1>You are offline.</h1>
      <p>Reconnect to view live route updates, portal data, and support messages.</p>
    </main>
  </body>
</html>
